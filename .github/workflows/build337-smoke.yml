name: Build 337 Compile and Optional Simulator Review
# Focused review requested after authored reactor and portal placement corrections.
on:
  push:
    branches:
      - feature/build337-environment-layouts
    paths:
      - .github/workflows/build337-smoke.yml
      - OutpostZero/OutpostScene.swift
      - OutpostZero/WorldOneRoomGeometry.swift
      - OutpostZero/WorldOneLayoutReview.swift
      - OutpostZero/WorldShowcase.swift
      - OutpostZero/RoomRules.swift
      - OutpostZero/TerrainHazards.swift
      - tests/WorldOneEnvironmentTests.swift
      - tests/test_focused_screenshots.py
      - scripts/validate_simulator_screenshots.py
  workflow_dispatch:
jobs:
  smoke:
    runs-on: macos-15-intel
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Validate geometry and gameplay rules without simulator startup
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_*.py'
          swiftc OutpostZero/RoomRules.swift OutpostZero/TerrainHazards.swift tests/RoomRulesTests.swift -o "$RUNNER_TEMP/room-tests"
          "$RUNNER_TEMP/room-tests"
          swiftc OutpostZero/WorldOneRoomGeometry.swift OutpostZero/RoomRules.swift OutpostZero/TerrainHazards.swift OutpostZero/CampaignPacing.swift OutpostZero/CombatRules.swift OutpostZero/WorldCatalog.swift OutpostZero/RunProgress.swift OutpostZero/PersistentProgression.swift tests/WorldOneEnvironmentTests.swift -o "$RUNNER_TEMP/environment-tests"
          "$RUNNER_TEMP/environment-tests"
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate art and project
        run: |
          set -euo pipefail
          python3 scripts/generate_icon.py
          python3 scripts/generate_forest_art.py
          python3 scripts/generate_pilot_art.py
          python3 scripts/generate_enemy_art.py
          xcodegen generate
      - name: Compile simulator app
        run: |
          set -euo pipefail
          xcodebuild -project OutpostZero.xcodeproj -scheme OutpostZero -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath DerivedData CODE_SIGNING_ALLOWED=NO build > smoke-build.log 2>&1 || { tail -100 smoke-build.log; exit 1; }
      - name: Launch World 1 and capture five review frames
        if: (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[visual-review]'))
        run: |
          set -euo pipefail
          mkdir -p screenshots diagnostics
          python3 - <<'PY'
          import json,subprocess,sys,time,pathlib
          def run(*args, timeout=60, check=True):
              print("RUN", " ".join(args), flush=True)
              p=subprocess.run(args, capture_output=True, text=True, timeout=timeout)
              print((p.stdout+p.stderr)[-2500:], flush=True)
              if check and p.returncode: raise RuntimeError(f"exit {p.returncode}: {args}")
              return p
          devices=json.loads(run("xcrun","simctl","list","devices","available","-j").stdout)["devices"]
          candidates=[d["udid"] for _,ds in sorted(devices.items(),reverse=True) for d in ds if d.get("isAvailable",True) and d["name"].startswith("iPhone")]
          if not candidates: raise RuntimeError("No available iPhone simulator")
          device=candidates[0]
          pathlib.Path("diagnostics/device.txt").write_text(device+"\n")
          run("xcrun","simctl","boot",device,timeout=45,check=False)
          run("xcrun","simctl","bootstatus",device,"-b",timeout=210)
          app="DerivedData/Build/Products/Debug-iphonesimulator/OutpostZero.app"
          try:
              run("xcrun","simctl","install",device,app,timeout=150)
          except subprocess.TimeoutExpired as exc:
              print("INSTALL TIMEOUT: collecting simulator diagnostics", flush=True)
              pathlib.Path("diagnostics/install-timeout.txt").write_text(str(exc))
              for cmd in [("xcrun","simctl","list","devices","booted"),
                          ("xcrun","simctl","io",device,"screenshot","diagnostics/install-timeout.png")]:
                  try:
                      run(*cmd,timeout=25,check=False)
                  except subprocess.TimeoutExpired as diagnostic_error:
                      print("DIAGNOSTIC TIMEOUT",str(diagnostic_error),flush=True)
                      with pathlib.Path("diagnostics/diagnostic-timeouts.txt").open("a") as out:
                          out.write(str(diagnostic_error)+"\\n")
              raise
          # Confirm the simulator can render before launching the application.
          run("xcrun","simctl","io",device,"screenshot","diagnostics/prelaunch-ready.png",timeout=45)
          def capture(label, flag, mossbot=False, terminate_first=True):
              if terminate_first:
                  try:
                      run("xcrun","simctl","terminate",device,"com.paulus.laststandcommand",timeout=20,check=False)
                  except subprocess.TimeoutExpired as exc:
                      print(f"WARNING: best-effort terminate timed out: {exc}", flush=True)
                      pathlib.Path(f"diagnostics/{label}-terminate-timeout.txt").write_text(str(exc))
                      # A stalled terminate may leave the previous app alive; do not claim a fresh capture.
                      raise RuntimeError("Simulator termination stalled; cannot guarantee capture isolation") from exc
              args=["xcrun","simctl","launch",device,"com.paulus.laststandcommand",flag]
              if mossbot: args.append("-reviewBuild337Mossbot")
              args.append("-requireWorldOneAuthoredArt")
              try:
                  run(*args,timeout=55)
                  time.sleep(8)
                  run("xcrun","simctl","io",device,"screenshot",f"screenshots/build337-{label}.png",timeout=45)
              except Exception as exc:
                  pathlib.Path(f"diagnostics/{label}-failure.txt").write_text(str(exc))
                  for cmd in [("xcrun","simctl","list","devices","booted"),("xcrun","simctl","io",device,"screenshot",f"diagnostics/{label}-simulator.png")]:
                      try: run(*cmd,timeout=25,check=False)
                      except subprocess.TimeoutExpired: print("Diagnostic command timed out:",cmd,flush=True)
                  raise
          # Baseline without opt-in artwork distinguishes simulator launch from animation initialization.
          capture("world1-baseline","-captureWorldOneOutpostScreenshot",terminate_first=False)
          capture("world1-mossbot","-captureWorldOneOutpostScreenshot",True)
          for label,flag in [("swamp","-captureWorldOneSwampScreenshot"),("caves","-captureWorldOneCavesScreenshot"),("boss","-captureWorldOneBossScreenshot")]:
              capture(label,flag,True)
          PY
          python3 scripts/validate_simulator_screenshots.py screenshots/*.png
      - name: Upload smoke screenshot and diagnostics
        if: always() && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[visual-review]'))
        uses: actions/upload-artifact@v4
        with:
          name: build337-simulator-smoke
          path: |
            screenshots/
            diagnostics/
            smoke-build.log
          if-no-files-found: ignore
          retention-days: 7
