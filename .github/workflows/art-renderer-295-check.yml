name: Art Renderer 295 Checks
on:
  push:
    branches: [art-renderer-foundation-295]
  workflow_dispatch:
jobs:
  renderer-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install build dependencies
        run: npm install --include=dev --no-audit --no-fund
      - name: Validate JavaScript syntax
        run: |
          node --check build.js
          node --check scripts/set-build-version.js
          node --check src/isometricMap221.js
          node --check src/artRenderer295.js
          node --check src/settlementView205.js
          node --check scripts/test-art-renderer-295.cjs
          node --check scripts/check-art-assets-295.cjs
      - name: Test modern renderer and infrastructure
        run: |
          node scripts/test-art-renderer-295.cjs
          LSC_MODERN_ART=1 node scripts/test-world-infrastructure.cjs
      - name: Build full game bundle (iOS prerequisite)
        run: |
          npm run build
          test -s www/index.html
      - name: Verify packaged Build 299 and modern renderer
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const assert = require('node:assert/strict');
          const html = fs.readFileSync('www/index.html', 'utf8');
          const config = fs.readFileSync('src/config.js', 'utf8');
          assert.match(config, /const LSC_BUILD = '299';/, 'Version script did not set Build 299');
          assert.match(html, /const LSC_BUILD = '299';/, 'Bundled game version is not 299');
          assert.ok(html.includes('window.LSC_BUILD_ART_PREVIEW = true;'), 'Modern art bundle flag missing');
          assert.ok(html.includes('root.LSCArt295=Object.freeze'), 'Modern renderer not bundled');
          assert.ok(html.includes("mode='preview'"), 'Modern renderer is not the default');
          console.log('PASS: Build 299 bundled with modern art enabled');
          NODE
      - name: Check production art readiness
        run: node scripts/check-art-assets-295.cjs --require-assets
