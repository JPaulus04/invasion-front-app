name: Art Renderer 295 Checks
on:
  push:
    branches: [art-renderer-foundation-295]
  workflow_dispatch:
jobs:
  renderer-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript syntax
        run: |
          node --check build.js
          node --check scripts/set-build-version.js
          node --check src/isometricMap221.js
          node --check src/artRenderer295.js
          node --check src/settlementView205.js
          node --check scripts/test-art-renderer-295.cjs
          node --check scripts/check-art-assets-295.cjs
      - name: Test preview renderer
        run: node scripts/test-art-renderer-295.cjs
      - name: Verify iOS preview configuration
        run: |
          grep -q "LSC_BUILD = '296'" scripts/set-build-version.js
          grep -Fq 'window.LSC_BUILD_ART_PREVIEW = true;' build.js
      - name: Check production art readiness
        run: node scripts/check-art-assets-295.cjs
