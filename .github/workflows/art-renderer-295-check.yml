name: Art Renderer 295 Checks
on:
  push:
    branches: [art-renderer-foundation-295]
  workflow_dispatch:
jobs:
  renderer-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install build dependencies
        run: npm install --include=dev --no-audit --no-fund
      - name: Validate JavaScript syntax
        run: |
          node --check build.js
          node --check scripts/set-build-version.js
          node --check src/isometricMap221.js
          node --check src/artRenderer295.js
          node --check src/settlementView205.js
          node --check scripts/test-art-renderer-295.cjs
          node --check scripts/check-art-assets-295.cjs
      - name: Test preview renderer
        run: node scripts/test-art-renderer-295.cjs
      - name: Verify iOS preview configuration
        run: |
          node -e "const fs=require('fs');const s=fs.readFileSync('scripts/set-build-version.js','utf8');if(!s.includes(\"const LSC_BUILD = '296';\"))throw Error('Build 296 marker missing from version script');"
          node -e "const fs=require('fs');const s=fs.readFileSync('build.js','utf8');if(!s.includes('window.LSC_BUILD_ART_PREVIEW = true;'))throw Error('Preview flag missing from build bundler');"
      - name: Build full game bundle (iOS prerequisite)
        run: |
          npm run build
          test -s www/index.html
      - name: Check production art readiness
        run: node scripts/check-art-assets-295.cjs
