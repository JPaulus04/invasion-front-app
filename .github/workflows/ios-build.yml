name: iOS Compile Check
on:
  push:
    branches: [outpost-zero]
  pull_request:
# Avoid wasting macOS runners on obsolete revisions during rapid iteration.
concurrency:
  group: ios-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Validate source tree
        run: python3 scripts/check_project.py
      - name: Validate production sprite assets
        run: python3 scripts/check_art_sprites.py
      - name: Test room rules
        run: |
          swiftc OutpostZero/RoomRules.swift tests/RoomRulesTests.swift -o "$RUNNER_TEMP/room-tests"
          "$RUNNER_TEMP/room-tests"
      - name: Test XP and combat rules
        run: |
          swiftc OutpostZero/RunProgress.swift OutpostZero/CombatRules.swift tests/ProgressCombatTests.swift -o "$RUNNER_TEMP/combat-tests"
          "$RUNNER_TEMP/combat-tests"
      - name: Generate original app icon
        run: python3 scripts/generate_icon.py
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Validate generated forest artwork
        run: |
          python3 scripts/generate_forest_art.py
          python3 scripts/generate_pilot_art.py
          python3 scripts/generate_enemy_art.py
          python3 scripts/check_art_sprites.py
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Compile iOS simulator app
        run: |
          set -o pipefail
          xcodebuild -project OutpostZero.xcodeproj -scheme OutpostZero -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath DerivedData CODE_SIGNING_ALLOWED=NO build 2>&1 | tee xcodebuild.log
      - name: Verify production character PNGs are bundled
        run: |
          set -e
          APP="DerivedData/Build/Products/Debug-iphonesimulator/OutpostZero.app"
          test -d "$APP"
          for ASSET in pilot_idle.png grunt_idle.png scout_idle.png raider_idle.png heavy_idle.png shooter_idle.png lobber_idle.png forest_pine.png forest_broadleaf.png; do
            FOUND="$(find "$APP" -type f -name "$ASSET" -print -quit)"
            if [ -z "$FOUND" ]; then
              echo "::error::$ASSET is missing from the compiled iOS app bundle"
              exit 1
            fi
            echo "Verified bundled asset: $FOUND"
          done
      - name: Capture actual simulator screenshot
        timeout-minutes: 10
        run: |
          set -e
          DEVICE="$(xcrun simctl list devices available | awk -F '[()]' '/iPhone [0-9]+/ {print $2; exit}')"
          test -n "$DEVICE"
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b
          APP="DerivedData/Build/Products/Debug-iphonesimulator/OutpostZero.app"
          xcrun simctl install "$DEVICE" "$APP"
          mkdir -p screenshots
          # A cold-booted simulator can show a gray launch screen for several
          # seconds while still returning success from 'simctl launch'.
          # Retry until a decoded screenshot contains actual rendered colors.
          capture_scene() {
            FLAG="$1"
            OUTPUT="$2"
            for ATTEMPT in 1 2 3; do
              xcrun simctl terminate "$DEVICE" com.paulus.laststandcommand || true
              xcrun simctl launch "$DEVICE" com.paulus.laststandcommand "$FLAG"
              sleep 4
              xcrun simctl io "$DEVICE" screenshot "$OUTPUT"
              if python3 scripts/validate_simulator_screenshots.py "$OUTPUT"; then
                return 0
              fi
              echo "::warning::Simulator frame for $FLAG not rendered (attempt $ATTEMPT); retrying"
            done
            echo "::error::Simulator never rendered a usable frame for $FLAG"
            return 1
          }
          capture_scene -captureGateScreenshot screenshots/build-314-gate-open.png
          capture_scene -captureCombatScreenshot screenshots/build-314-simulator.png
      - name: Validate simulator screenshot was captured
        run: |
          set -e
          test -s screenshots/build-314-simulator.png
          test -s screenshots/build-314-gate-open.png
          python3 scripts/validate_simulator_screenshots.py screenshots/build-314-simulator.png screenshots/build-314-gate-open.png
      - name: Upload actual simulator screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-314-simulator-screenshot
          path: screenshots/build-314-*.png
          if-no-files-found: ignore
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-log
          path: xcodebuild.log
          if-no-files-found: ignore
