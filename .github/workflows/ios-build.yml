          from hashlib import sha256
          from pathlib import Path
          names = ["west", "center", "east"]
          frames = [Path(f"screenshots/outpost-zero-arena-{n}.png").read_bytes()
                    for n in names]
          assert len({sha256(frame).digest() for frame in frames}) == 3, (
              "Expanded arena camera must produce three different views")
          print("PASS: expanded arena has distinct west, center, east screenshots")
          PY
          test -s screenshots/outpost-zero-settings.png
          test -s screenshots/outpost-zero-paused-run.png
          test -s screenshots/outpost-zero-home-navigation.png
          test -s screenshots/outpost-zero-world-selector.png
          python3 scripts/validate_simulator_screenshots.py \
            screenshots/outpost-zero-home-navigation.png \
            screenshots/outpost-zero-world-selector.png
          test -s screenshots/outpost-zero-headquarters.png
          test -s screenshots/outpost-zero-recovery.png
          python3 scripts/validate_simulator_screenshots.py screenshots/outpost-zero-headquarters.png
          python3 scripts/validate_simulator_screenshots.py screenshots/outpost-zero-settings.png screenshots/outpost-zero-paused-run.png
          test -s screenshots/outpost-zero-loadout.png
          test -s screenshots/outpost-zero-overgrown-path.png
          test -s screenshots/outpost-zero-terrain.png
          test -s screenshots/outpost-zero-frontier-guardian-armored.png
          test -s screenshots/outpost-zero-frontier-guardian-exposed.png
          test -s screenshots/outpost-zero-frontier-guardian-resolved.png
          python3 scripts/validate_simulator_screenshots.py \
            screenshots/outpost-zero-frontier-guardian-armored.png \
            screenshots/outpost-zero-frontier-guardian-exposed.png \
            screenshots/outpost-zero-frontier-guardian-resolved.png
          test "$(shasum -a 256 screenshots/outpost-zero-frontier-guardian-armored.png | cut -d ' ' -f 1)" != "$(shasum -a 256 screenshots/outpost-zero-frontier-guardian-exposed.png | cut -d ' ' -f 1)"
          test "$(shasum -a 256 screenshots/outpost-zero-frontier-guardian-exposed.png | cut -d ' ' -f 1)" != "$(shasum -a 256 screenshots/outpost-zero-frontier-guardian-resolved.png | cut -d ' ' -f 1)"
          test -s screenshots/outpost-zero-tidal-warden.png
          test -s screenshots/outpost-zero-toxic-sentinel.png
          test -s screenshots/outpost-zero-flooded-outpost.png
          test -s screenshots/outpost-zero-toxic-crossing.png
          test -s screenshots/outpost-zero-acid-active.png
          python3 scripts/validate_simulator_screenshots.py screenshots/outpost-zero-acid-active.png
          python3 - <<'PY'
          from hashlib import sha256
          from pathlib import Path
          resting = Path("screenshots/outpost-zero-flooded-outpost.png").read_bytes()
          active = Path("screenshots/outpost-zero-acid-active.png").read_bytes()
          assert sha256(resting).digest() != sha256(active).digest(), (
              "Active acid presentation must visibly differ from inactive runoff")
          print("PASS: World 3 acid has distinct active-phase imagery")
          PY
          python3 scripts/validate_simulator_screenshots.py screenshots/outpost-zero-terrain.png
          python3 scripts/validate_simulator_screenshots.py screenshots/outpost-zero-tidal-warden.png
          python3 scripts/validate_simulator_screenshots.py screenshots/outpost-zero-toxic-sentinel.png
          python3 scripts/validate_simulator_screenshots.py screenshots/outpost-zero-flooded-outpost.png
          python3 scripts/validate_simulator_screenshots.py screenshots/outpost-zero-toxic-crossing.png
          python3 scripts/validate_simulator_screenshots.py screenshots/outpost-zero-loadout.png screenshots/outpost-zero-overgrown-path.png
          test -s screenshots/outpost-zero-simulator.png
          test -s screenshots/outpost-zero-combat-feedback.png
          test -s screenshots/outpost-zero-tactical-abilities.png
          python3 scripts/validate_simulator_screenshots.py screenshots/outpost-zero-tactical-abilities.png
          python3 scripts/validate_simulator_screenshots.py screenshots/outpost-zero-combat-feedback.png
          test -s screenshots/outpost-zero-gate-open.png
          test -s screenshots/outpost-zero-defense-active.png
          test -s screenshots/outpost-zero-defense-cleared.png
          test -s screenshots/outpost-zero-defense-failed.png
          python3 scripts/validate_simulator_screenshots.py screenshots/outpost-zero-defense-active.png screenshots/outpost-zero-defense-cleared.png screenshots/outpost-zero-defense-failed.png
          test -s screenshots/outpost-zero-flank-warning.png
          test -s screenshots/outpost-zero-flank-arrival.png
          test -s screenshots/outpost-zero-frost-rounds.png
          python3 scripts/validate_simulator_screenshots.py \
            screenshots/outpost-zero-flank-warning.png \
            screenshots/outpost-zero-flank-arrival.png
          test "$(shasum -a 256 screenshots/outpost-zero-flank-warning.png | cut -d ' ' -f 1)" != "$(shasum -a 256 screenshots/outpost-zero-flank-arrival.png | cut -d ' ' -f 1)"
          test -s screenshots/outpost-zero-level-up.png
          test -s screenshots/outpost-zero-level-up-resumed.png
          python3 scripts/validate_simulator_screenshots.py screenshots/outpost-zero-frost-rounds.png
          python3 scripts/validate_simulator_screenshots.py screenshots/outpost-zero-simulator.png screenshots/outpost-zero-gate-open.png
          python3 scripts/validate_simulator_screenshots.py screenshots/outpost-zero-level-up.png screenshots/outpost-zero-level-up-resumed.png
          python3 - <<'PY'
          from pathlib import Path
          from hashlib import sha256
          paused = Path("screenshots/outpost-zero-level-up.png").read_bytes()
          resumed = Path("screenshots/outpost-zero-level-up-resumed.png").read_bytes()
          assert sha256(paused).digest() != sha256(resumed).digest(), "Level-up selection did not change scene"
          print("PASS: XP-on-kill level-up menu and resumed combat frames differ")
          PY
          python3 scripts/validate_simulator_screenshots.py \
            screenshots/outpost-zero-motion-1.png \
            screenshots/outpost-zero-motion-2.png \
            screenshots/outpost-zero-motion-3.png
          python3 - <<'PY'
          from pathlib import Path
          from hashlib import sha256
          frames = [Path(f"screenshots/outpost-zero-motion-{index}.png").read_bytes() for index in (1, 2, 3)]
          hashes = {sha256(frame).digest() for frame in frames}
          assert len(hashes) >= 2, "Live combat snapshots are identical: scene may be frozen"
          print(f"PASS: {len(hashes)} different live combat captures")
          PY
          # A successful screenshot command can still capture SpringBoard after
          # the app exits. Verify the live frame has substantial battlefield detail.
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          for path in sorted(Path("screenshots").glob("outpost-zero-survival-*.png")):
              image = Image.open(path).convert("RGB")
              colors = len(image.resize((120, 260)).getcolors(120 * 260) or [])
              assert colors >= 100, f"{path}: suspiciously empty live scene ({colors} colors)"
          print("PASS: survival captures contain detailed gameplay imagery")
          PY
          python3 scripts/validate_simulator_screenshots.py \
            screenshots/outpost-zero-survival-1.png \
            screenshots/outpost-zero-survival-2.png \
            screenshots/outpost-zero-survival-3.png
          python3 - <<'PY'
          from pathlib import Path
          from hashlib import sha256
          data = [Path(f"screenshots/outpost-zero-survival-{i}.png").read_bytes()
                  for i in (1, 2, 3)]
          assert len({sha256(frame).digest() for frame in data}) >= 2, (
              "Survival gameplay frames must change over time")
          print("PASS: actual changing survival-swarm combat frames")
          PY
          python3 scripts/validate_simulator_screenshots.py \
            screenshots/outpost-zero-ranged-1.png \
            screenshots/outpost-zero-ranged-2.png \
            screenshots/outpost-zero-ranged-3.png
          python3 - <<'PY'
          from pathlib import Path
          from hashlib import sha256
          files = [Path(f"screenshots/outpost-zero-ranged-{i}.png").read_bytes() for i in (1, 2, 3)]
          assert len({sha256(data).digest() for data in files}) >= 2, "Ranged combat scene did not change over time"
          print("PASS: three live ranged enemy screenshots")
          PY
      - name: Build consolidated Build 331 visual review board
        if: always()
        run: |
          python3 scripts/create_visual_review_board.py
      - name: Upload visual review manifest
