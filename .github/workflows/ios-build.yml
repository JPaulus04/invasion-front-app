          if-no-files-found: ignore


  phase4-gameplay:
    needs: build
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[phase4-review]')
    uses: ./.github/workflows/phase4-gameplay.yml

  phase4-presentation-review:
    name: Focused gameplay presentation
    # Standard visual acceptance: every pushed build captures the same
    # gameplay presentation scenes. Full reviews remain release checkpoints.
    if: >-
      github.event_name == 'push' &&
      !contains(github.event.head_commit.message, '[home-review]')
    needs: build
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: outpost-zero-simulator-app
      - name: Restore compiled application
        run: |
          mkdir -p simulator-app
          ditto -x -k OutpostZero-simulator-app.zip simulator-app
          test -x simulator-app/OutpostZero.app/OutpostZero
      - name: Capture focused HUD, objectives, upgrades and victory
        timeout-minutes: 24
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, subprocess, time, pathlib, shutil, signal, re
          def run(args, limit=40, check=True):
              return subprocess.run(args, timeout=limit, check=check, capture_output=True, text=True)
          # CoreSimulator can be slow to initialize on fresh hosted runners.
          # Retry discovery instead of failing after the first 45 seconds.
          for attempt in range(3):
              try:
                  devices=json.loads(run(["xcrun","simctl","list","devices","available","-j"],120).stdout)["devices"]
                  break
              except (subprocess.TimeoutExpired, subprocess.CalledProcessError):
                  if attempt == 2: raise
                  time.sleep(12)
          choices=[(runtime,d) for runtime,group in devices.items()
                   for d in group if d.get("isAvailable",True)
                   and d.get("name","").startswith("iPhone")
                   and d.get("deviceTypeIdentifier")]
          if not choices: raise SystemExit("No iPhone simulator available")
          runtime,template=choices[0]
          pathlib.Path("screenshots").mkdir(exist_ok=True)
          captures=[
              ("-captureGateScreenshot","exit-beacon"),
              ("-captureLevelUpScreenshot","upgrade-cards"),
              ("-captureEquipmentDefenseScreenshot","reactor"),
              ("-captureVictoryScreenshot","victory"),
              ("-captureCombatScreenshot","combat-hud"),
              ("-captureEquipmentDefenseClearScreenshot","reactor-secured"),
              ("-captureEquipmentDefenseFailureScreenshot","reactor-lost"),
              ("-cameraReviewEntry","camera-entry"),
              ("-cameraReviewMiddle","camera-middle"),
              ("-cameraReviewMotion","camera-motion"),
          ]
          def new_device():
              created=run(["xcrun","simctl","create","OutpostZero-Phase4-Visual",
                           template["deviceTypeIdentifier"],runtime],90).stdout.strip()
              print("New visual simulator:",created,flush=True)
              try:
                  run(["xcrun","simctl","boot",created],90)
                  run(["xcrun","simctl","bootstatus",created,"-b"],300)
                  run(["xcrun","simctl","install",created,"simulator-app/OutpostZero.app"],150)
                  return created
              except Exception:
                  discard(created)
                  raise
          def discard(udid):
              if not udid: return
              for action in ("shutdown","delete"):
                  try: run(["xcrun","simctl",action,udid],30,False)
                  except (subprocess.TimeoutExpired,subprocess.CalledProcessError) as error:
                      print(f"Simulator {action} failed: {error}",flush=True)
          device=None
          try:
              for flag,name in captures:
                  camera_review = name.startswith("camera-")
                  output=pathlib.Path(f"screenshots/{name}/phase4-exit-beacon.png" if camera_review else f"screenshots/phase4-{name}.png")
                  output.parent.mkdir(parents=True, exist_ok=True)
                  for attempt in range(3):
                      output.unlink(missing_ok=True)
                      try:
                          if device is None: device=new_device()
                          stdout=pathlib.Path(f"screenshots/phase4-{name}-stdout.log").resolve()
                          stderr=pathlib.Path(f"screenshots/phase4-{name}-stderr.log").resolve()
                          launch_flags = ["-captureGateScreenshot", flag] if camera_review else [flag]
                          recording = None
                          video = pathlib.Path("screenshots/camera-traversal.mov")
                          if name == "camera-motion":
                              video.unlink(missing_ok=True)
                              recording = subprocess.Popen(["xcrun","simctl","io",device,"recordVideo",str(video)],
                                  stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
                          try:
                              result=run(["xcrun","simctl","launch","--terminate-running-process",
                                      "--stdout="+str(stdout),"--stderr="+str(stderr),
                                          device,"com.paulus.laststandcommand",*launch_flags],90)
                              print("Launch:",result.stdout.strip(),flush=True)
                              time.sleep(12 if recording else 9)
                          finally:
                              if recording is not None:
                                  recording.send_signal(signal.SIGINT)
                                  try: recording.wait(timeout=30)
                                  except subprocess.TimeoutExpired:
                                      recording.kill()
                                      recording.wait()
                                      raise RuntimeError("Camera video recorder failed to finalize")
                          if name == "camera-motion":
                              if recording.returncode != 0 or not video.exists() or video.stat().st_size < 4096:
                                  raise RuntimeError("Camera traversal video missing")
                              samples = re.findall(r"\[CAMERA MOTION\] pilotY=([-\d.]+) cameraY=([-\d.]+)", stdout.read_text())
                              if len(samples) < 3:
                                  raise RuntimeError("Missing camera motion samples")
                              for column in (0, 1):
                                  values = [float(row[column]) for row in samples]
                                  if max(values)-min(values) < 40:
                                      raise RuntimeError("Pilot or camera failed to traverse")
                          run(["xcrun","simctl","io",device,"screenshot",str(output)],65)
                          if not output.is_file() or output.stat().st_size < 4096:
                              raise RuntimeError(f"{name}: missing or empty screenshot")
                          validation=run(["python3","scripts/validate_simulator_screenshots.py",str(output)],120,False)
                          print(validation.stdout,validation.stderr,flush=True)
                          if validation.returncode:
                              raise RuntimeError(f"{name}: screenshot validation failed")
                          print("Captured",output,flush=True)
                          break
                      except (subprocess.TimeoutExpired,subprocess.CalledProcessError,RuntimeError) as error:
                          print(f"{name} attempt {attempt+1}/3 failed: {error}",flush=True)
                          if attempt == 2:
                              for stream in ("stdout","stderr"):
                                  log=pathlib.Path(f"screenshots/phase4-{name}-{stream}.log")
                                  if log.exists(): print(log.read_text(errors="replace")[-12000:],flush=True)
                              raise
                          # A hung CoreSimulator instance is not recoverable
                          # reliably. Discard it and use a new device UUID.
                          discard(device)
                          device=None
                          time.sleep(5)
          finally:
              diagnostic=pathlib.Path("screenshots/diagnostics")
              diagnostic.mkdir(parents=True,exist_ok=True)
              for report in (pathlib.Path.home()/"Library/Logs/DiagnosticReports").glob("OutpostZero*"):
                  if report.is_file(): shutil.copy2(report,diagnostic/report.name)
              discard(device)
          PY
      - name: Validate captured frames
        run: python3 scripts/validate_simulator_screenshots.py screenshots/phase4-{exit-beacon,upgrade-cards,reactor,victory,combat-hud,reactor-secured,reactor-lost}.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase4-presentation-screenshots
          path: screenshots/
          if-no-files-found: warn
          retention-days: 14
