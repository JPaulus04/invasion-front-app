name: iOS Compile Check
on:
  push:
    branches: [outpost-zero]
  pull_request:
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Validate source tree
        run: python3 scripts/check_project.py
      - name: Validate production sprite assets
        run: python3 scripts/check_art_sprites.py
      - name: Test room rules
        run: |
          swiftc OutpostZero/RoomRules.swift tests/RoomRulesTests.swift -o "$RUNNER_TEMP/room-tests"
          "$RUNNER_TEMP/room-tests"
      - name: Test XP and combat rules
        run: |
          swiftc OutpostZero/RunProgress.swift OutpostZero/CombatRules.swift tests/ProgressCombatTests.swift -o "$RUNNER_TEMP/combat-tests"
          "$RUNNER_TEMP/combat-tests"
      - name: Generate original app icon
        run: python3 scripts/generate_icon.py
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Validate generated forest artwork
        run: |
          python3 scripts/generate_forest_art.py
          python3 scripts/check_art_sprites.py
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Compile iOS simulator app
        run: |
          set -o pipefail
          xcodebuild -project OutpostZero.xcodeproj -scheme OutpostZero -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath DerivedData CODE_SIGNING_ALLOWED=NO build 2>&1 | tee xcodebuild.log
      - name: Verify production character PNGs are bundled
        run: |
          set -e
          APP="DerivedData/Build/Products/Debug-iphonesimulator/OutpostZero.app"
          test -d "$APP"
          for ASSET in pilot_idle.png scout_idle.png heavy_idle.png forest_pine.png; do
            FOUND="$(find "$APP" -type f -name "$ASSET" -print -quit)"
            if [ -z "$FOUND" ]; then
              echo "::error::$ASSET is missing from the compiled iOS app bundle"
              exit 1
            fi
            echo "Verified bundled asset: $FOUND"
          done
      - name: Capture actual simulator screenshot
        run: |
          set -e
          DEVICE="$(xcrun simctl list devices available | awk -F '[()]' '/iPhone [0-9]+/ {print $2; exit}')"
          test -n "$DEVICE"
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b
          APP="DerivedData/Build/Products/Debug-iphonesimulator/OutpostZero.app"
          xcrun simctl install "$DEVICE" "$APP"
          xcrun simctl launch "$DEVICE" com.paulus.laststandcommand -captureCombatScreenshot
          sleep 8
          mkdir -p screenshots
          xcrun simctl io "$DEVICE" screenshot screenshots/build-314-simulator.png
      - name: Validate simulator screenshot was captured
        run: |
          set -e
          test -s screenshots/build-314-simulator.png
          python3 - <<'PY'
          from pathlib import Path
          import struct
          p = Path("screenshots/build-314-simulator.png")
          data = p.read_bytes()
          assert data[:8] == b'\\x89PNG\\r\\n\\x1a\\n', "Screenshot is not a PNG"
          width, height = struct.unpack(">II", data[16:24])
          assert width >= 320 and height >= 568, f"Unexpected screenshot dimensions: {width}x{height}"
          print(f"Verified simulator screenshot: {width}x{height}, {len(data)} bytes")
          PY
      - name: Upload actual simulator screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-314-simulator-screenshot
          path: screenshots/build-314-simulator.png
          if-no-files-found: ignore
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-log
          path: xcodebuild.log
          if-no-files-found: ignore
