name: TestFlight Release

on:
  push:
    branches: [build-327]
  workflow_dispatch:
    inputs:
      build_number:
        description: "Unique TestFlight build number"
        required: true
        default: "330"

env:
  RELEASE_BUILD_NUMBER: ${{ github.event_name == 'workflow_dispatch' && inputs.build_number || '332' }}

jobs:
  release-gate:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[testflight-332]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
    steps:
      - name: Require same-SHA gameplay and presentation success before releasing
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json, os, sys, time, urllib.request
          repo, sha = os.environ["REPOSITORY"], os.environ["RELEASE_SHA"]
          def get(path):
              request = urllib.request.Request(
                  "https://api.github.com/repos/" + repo + "/" + path,
                  headers={"Authorization": "Bearer " + os.environ["GITHUB_TOKEN"],
                           "Accept": "application/vnd.github+json",
                           "X-GitHub-Api-Version": "2022-11-28"})
              with urllib.request.urlopen(request, timeout=35) as response:
                  return json.load(response)
          required = {"build", "Focused gameplay presentation",
                      "phase4-gameplay / Fresh World 1 — stationary",
                      "phase4-gameplay / Fresh World 1 — moving",
                      "phase4-gameplay / Assess World 1 gameplay outcomes"}
          for attempt in range(135):
              if get("branches/build-327")["commit"]["sha"] != sha:
                  sys.exit("Release blocked: branch moved after release candidate")
              runs = [r for r in get("actions/runs?head_sha=" + sha +
                                     "&per_page=100").get("workflow_runs", [])
                      if r["name"] == "iOS Compile Check"
                      and r["event"] == "push" and r["head_sha"] == sha]
              if runs:
                  run = max(runs, key=lambda r: r["id"])
                  if run["status"] == "completed":
                      if run["conclusion"] != "success":
                          sys.exit("Release blocked: iOS/gameplay validation failed: "
                                   + run["html_url"])
                      jobs = get("actions/runs/" + str(run["id"]) + "/jobs?per_page=100")
                      status = {j["name"]: j["conclusion"] for j in jobs["jobs"]}
                      failed = {name: status.get(name) for name in required
                                if status.get(name) != "success"}
                      if failed:
                          sys.exit("Release blocked: required jobs missing/failed: " + repr(failed))
                      print("Build 332 approved for TestFlight from", run["html_url"])
                      break
                  print("Validating:", run["html_url"], flush=True)
              else:
                  print("Awaiting compile workflow for", sha, flush=True)
              time.sleep(20)
          else:
              sys.exit("Release blocked: validation exceeded gate window")
          PY

  testflight:
    needs: release-gate
    if: always() && (github.event_name == 'workflow_dispatch' || needs.release-gate.result == 'success')
    runs-on: macos-26
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Select supported Xcode
        run: |
          set -e
          if [ -d /Applications/Xcode_26.4.app ]; then
            sudo xcode-select -s /Applications/Xcode_26.4.app
          elif [ -d /Applications/Xcode_26.3.app ]; then
            sudo xcode-select -s /Applications/Xcode_26.3.app
          else
            echo "::error::Xcode 26.3 or 26.4 not found"
            exit 1
          fi
          xcodebuild -version
          xcodebuild -showsdks
          xcodebuild -version | grep -E '^Xcode 26([.]|$)'
          xcodebuild -showsdks | grep -E 'iphoneos26([.]|$)'
      - name: Verify required release secrets
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_API_KEY_BASE64: ${{ secrets.ASC_API_KEY }}
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.CERTIFICATE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
        run: |
          for name in APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_API_KEY_BASE64 IOS_DISTRIBUTION_P12_BASE64 KEYCHAIN_PASSWORD IOS_PROVISIONING_PROFILE_BASE64; do
            if [ -z "${!name}" ]; then echo "::error::Missing secret: $name"; exit 1; fi
          done
      - name: Validate TestFlight build number
        env:
          BUILD_NUMBER: ${{ env.RELEASE_BUILD_NUMBER }}
        run: |
          if ! [[ "$BUILD_NUMBER" =~ ^[0-9]+$ ]] || [ "$BUILD_NUMBER" -lt 317 ]; then
            echo "::error::Build number must be numeric and at least 317."
            exit 1
          fi
      - name: Validate project
        run: python3 scripts/check_project.py
      - name: Require all twelve menu artwork assets
        run: python3 scripts/audit_menu_art.py --require-all
      - name: Generate original app icon
        run: python3 scripts/generate_icon.py
      - name: Prepare and validate all production artwork
        run: |
          set -e
          python3 scripts/generate_forest_art.py
          python3 scripts/generate_pilot_art.py
          python3 scripts/generate_enemy_art.py
          python3 scripts/check_art_sprites.py
          # Fail before signing or uploading if any gameplay sprite is absent.
          for ASSET in pilot_idle.png grunt_idle.png scout_idle.png raider_idle.png heavy_idle.png shooter_idle.png lobber_idle.png forest_pine.png forest_broadleaf.png; do
            test -s "OutpostZero/ArtAssets/$ASSET" || { echo "::error::Missing generated asset: $ASSET"; exit 1; }
          done
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Compile simulator before signing or uploading
        run: |
          set -o pipefail
          xcodebuild -project OutpostZero.xcodeproj -scheme OutpostZero -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/OutpostZeroSimulatorDerivedData" CODE_SIGNING_ALLOWED=NO build 2>&1 | tee simulator-build.log
      - name: Verify artwork inside compiled simulator bundle
        run: |
          set -e
          # Use the exact DerivedData path supplied to the compile step.
          # This is stable across macOS runner images and avoids false negatives.
          APP="$RUNNER_TEMP/OutpostZeroSimulatorDerivedData/Build/Products/Debug-iphonesimulator/OutpostZero.app"
          test -d "$APP"
          for ASSET in pilot_idle.png grunt_idle.png scout_idle.png raider_idle.png heavy_idle.png shooter_idle.png lobber_idle.png forest_pine.png forest_broadleaf.png; do
            find "$APP" -type f -name "$ASSET" -print -quit | grep -q . || { echo "::error::Simulator app missing $ASSET"; exit 1; }
          done
      - name: Install signing credentials using existing LSC configuration
        env:
          CERTIFICATE_BASE64: ${{ secrets.CERTIFICATE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          echo "$CERTIFICATE_BASE64" | base64 --decode > certificate.p12
          security import certificate.p12 -k build.keychain -P "build123" -f pkcs12 -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$PROVISIONING_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          PROFILE_UUID=$(security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" | plutil -extract UUID raw -o - -)
          cp "$RUNNER_TEMP/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"
          security find-identity -v -p codesigning build.keychain
          if ! security find-identity -v -p codesigning build.keychain | grep -Eq 'Apple Distribution|iPhone Distribution'; then
            echo "::error::No Apple distribution signing identity is available in the imported keychain."
            exit 1
          fi
      - name: Archive signed iOS app
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -o pipefail
          xcodebuild -project OutpostZero.xcodeproj -scheme OutpostZero -configuration Release -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/OutpostZero.xcarchive" -derivedDataPath "$RUNNER_TEMP/DerivedData" DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CURRENT_PROJECT_VERSION="${{ env.RELEASE_BUILD_NUMBER }}" CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="Apple Distribution" PROVISIONING_PROFILE_SPECIFIER="$PROFILE_UUID" OTHER_CODE_SIGN_FLAGS="--keychain build.keychain" archive 2>&1 | tee archive.log
      - name: Export App Store IPA
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>method</key><string>app-store-connect</string>
          <key>teamID</key><string>$APPLE_TEAM_ID</string>
          <key>signingStyle</key><string>manual</string>
          <key>provisioningProfiles</key><dict><key>com.paulus.laststandcommand</key><string>$PROFILE_UUID</string></dict>
          <key>destination</key><string>export</string>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/OutpostZero.xcarchive" -exportPath "$RUNNER_TEMP/export" -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" 2>&1 | tee export.log
      - name: Verify exported IPA identity
        env:
          EXPECTED_BUILD: ${{ env.RELEASE_BUILD_NUMBER }}
        run: |
          python3 - <<'PY'
          import glob, os, plistlib, zipfile
          ipa_files = glob.glob(os.environ["RUNNER_TEMP"] + "/export/*.ipa")
          if len(ipa_files) != 1:
              raise SystemExit(f"Expected one IPA, found {len(ipa_files)}")
          with zipfile.ZipFile(ipa_files[0]) as archive:
              info_path = next((n for n in archive.namelist() if n.startswith("Payload/") and n.endswith(".app/Info.plist")), None)
              if not info_path:
                  raise SystemExit("Missing app Info.plist in IPA")
              info = plistlib.loads(archive.read(info_path))
          expected = "com.paulus.laststandcommand"
          actual = info.get("CFBundleIdentifier")
          number = str(info.get("CFBundleVersion", ""))
          if actual != expected:
              raise SystemExit(f"Unexpected bundle identifier: {actual}")
          if number != os.environ["EXPECTED_BUILD"]:
              raise SystemExit(f"Unexpected build number: {number}")
          # The signed export must contain the same art verified in simulator.
          required = ("pilot_idle.png", "grunt_idle.png", "scout_idle.png",
                      "raider_idle.png", "heavy_idle.png", "shooter_idle.png",
                      "lobber_idle.png", "forest_pine.png", "forest_broadleaf.png",
                      *(f"commander_{name}_{state}.png"
                        for name in ("vanguard", "specter", "bulwark", "volt")
                        for state in ("card", "locked")),
                      *(f"world_{name}_island.png" for name in ("forest", "ice", "lava", "void")))
          with zipfile.ZipFile(ipa_files[0]) as archive:
              bundled = archive.namelist()
              for asset in required:
                  if not any(name.endswith("/" + asset) for name in bundled):
                      raise SystemExit(f"Exported IPA missing production artwork: {asset}")
          print(f"Verified IPA: {actual}, build {number}, {len(required)} production sprites")
          PY
      - name: Upload to App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_API_KEY_BASE64: ${{ secrets.ASC_API_KEY }}
        run: |
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          echo "$ASC_API_KEY_BASE64" | base64 --decode > "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          chmod 600 "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          IPA="$(find "$RUNNER_TEMP/export" -name '*.ipa' -print -quit)"
          test -n "$IPA"
          xcrun altool --upload-app -f "$IPA" -t ios --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
      - name: Confirm Apple receipt and processing status
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_API_KEY: ${{ secrets.ASC_API_KEY }}
          EXPECTED_BUILD: ${{ env.RELEASE_BUILD_NUMBER }}
        run: |
          node <<'NODE'
          const crypto = require('node:crypto');
          const fs = require('node:fs');
          async function main() {
            const key = crypto.createPrivateKey(Buffer.from(process.env.ASC_API_KEY, 'base64'));
            const report = text => {
              console.log(text);
              fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, text + '\n\n');
            };
            async function get(path) {
              const now = Math.floor(Date.now() / 1000);
              const b64 = value => Buffer.from(JSON.stringify(value)).toString('base64url');
              const unsigned = b64({alg:'ES256',kid:process.env.ASC_KEY_ID,typ:'JWT'}) + '.' +
                b64({iss:process.env.ASC_ISSUER_ID,iat:now,exp:now+300,aud:'appstoreconnect-v1'});
              const token = unsigned + '.' + crypto.sign('sha256', Buffer.from(unsigned),
                {key,dsaEncoding:'ieee-p1363'}).toString('base64url');
              const response = await fetch('https://api.appstoreconnect.apple.com/v1/' + path, {
                headers: {Authorization:'Bearer ' + token}, redirect:'error',
                signal: AbortSignal.timeout(30000)
              });
              if (!response.ok) throw new Error('Apple status lookup HTTP ' + response.status);
              return response.json();
            }
            const apps = await get('apps?filter[bundleId]=com.paulus.laststandcommand');
            const app = apps.data?.find(a => a.attributes.bundleId === 'com.paulus.laststandcommand');
            if (!app) throw new Error('Apple app record not found');
            for (let attempt = 0; attempt < 20; attempt++) {
              const builds = await get('builds?filter[app]=' + encodeURIComponent(app.id) +
                '&filter[version]=' + encodeURIComponent(process.env.EXPECTED_BUILD) + '&sort=-uploadedDate&limit=10');
              const build = builds.data?.find(b => b.attributes.version === process.env.EXPECTED_BUILD);
              if (build) {
                const state = build.attributes.processingState;
                report('Apple received Build ' + build.attributes.version + ': ' + state +
                  ' (uploaded ' + build.attributes.uploadedDate + ')');
                if (state === 'VALID') return;
                if (state === 'FAILED' || state === 'INVALID') throw new Error('Apple processing ' + state);
                if (attempt === 19) return;
              } else if (attempt === 19) {
                throw new Error('Upload command completed, but Apple receipt is not yet confirmed');
              }
              await new Promise(resolve => setTimeout(resolve, 30000));
            }
          }
          main().catch(error => {
            console.error('::error::' + (error.message.startsWith('Apple') || error.message.startsWith('Upload')
              ? error.message : 'Processing lookup failed; sensitive details withheld'));
            process.exitCode = 1;
          });
          NODE
      - name: Upload non-secret diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testflight-build-logs
          path: |
            simulator-build.log
            archive.log
            export.log
          if-no-files-found: ignore
