name: Build 338 World 1 validation
on:
  push:
    branches: [feature/build338-unified-world1]
    paths: ['OutpostZero/**', 'tests/**', 'scripts/**', 'project.yml', '.github/workflows/build338-world1.yml']
  workflow_dispatch:
    inputs:
      visual:
        description: Record the ten-stage live environment tour
        type: boolean
        default: false
concurrency:
  group: build338-${{ github.ref }}-${{ inputs.visual && 'visual' || 'routine' }}
  cancel-in-progress: true
jobs:
  validate:
    # Match successful main presentation/gameplay run 43768308294.
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PNG test decoder
        run: python3 -m pip install 'Pillow>=11'
      - name: Source, asset and failure-handling tests
        run: |
          set -euo pipefail
          python3 scripts/check_project.py
          python3 scripts/audit_build337_enemies.py
          python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Room, environment, animation and gameplay rules
        run: |
          set -euo pipefail
          swiftc OutpostZero/RoomRules.swift OutpostZero/TerrainHazards.swift tests/RoomRulesTests.swift -o "$RUNNER_TEMP/rooms"
          "$RUNNER_TEMP/rooms"
          COMMON='OutpostZero/WorldOneRoomGeometry.swift OutpostZero/WorldOneArtMetrics.swift OutpostZero/RoomRules.swift OutpostZero/TerrainHazards.swift OutpostZero/CampaignPacing.swift OutpostZero/CombatRules.swift OutpostZero/WorldCatalog.swift OutpostZero/RunProgress.swift OutpostZero/PersistentProgression.swift'
          swiftc $COMMON tests/WorldOneEnvironmentTests.swift -o "$RUNNER_TEMP/environments"
          "$RUNNER_TEMP/environments"
          swiftc $COMMON OutpostZero/WorldOneEnvironmentPlan.swift tests/WorldOneUnifiedTests.swift -o "$RUNNER_TEMP/unified"
          "$RUNNER_TEMP/unified"
          swiftc OutpostZero/EnemyAnimationRules.swift tests/EnemyAnimationRulesTests.swift -o "$RUNNER_TEMP/animations"
          "$RUNNER_TEMP/animations"
          swiftc OutpostZero/QAReplay.swift tests/QAReplayTests.swift -o "$RUNNER_TEMP/replays"
          "$RUNNER_TEMP/replays"
          swiftc OutpostZero/QACombatDriver.swift tests/QACombatDriverTests.swift -o "$RUNNER_TEMP/driver"
          "$RUNNER_TEMP/driver"
          swiftc OutpostZero/RunProgress.swift OutpostZero/CombatRules.swift OutpostZero/WorldCatalog.swift OutpostZero/CampaignPacing.swift OutpostZero/PersistentProgression.swift tests/CampaignPacingTests.swift -o "$RUNNER_TEMP/pacing"
          "$RUNNER_TEMP/pacing"
      - name: Generate project and compile simulator app
        run: |
          set -euo pipefail
          brew install xcodegen
          python3 scripts/generate_icon.py
          python3 scripts/generate_forest_art.py
          python3 scripts/generate_pilot_art.py
          python3 scripts/generate_enemy_art.py
          xcodegen generate
          xcodebuild -project OutpostZero.xcodeproj -scheme OutpostZero -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath DerivedData CODE_SIGNING_ALLOWED=NO build > build338-build.log 2>&1 || { tail -100 build338-build.log; exit 1; }
      - name: Verify actual app-bundle resources
        run: python3 scripts/verify_build338_bundle.py
      - name: Record live environment tour
        if: github.event_name == 'workflow_dispatch' && inputs.visual
        run: python3 scripts/run_build338_review.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build338-validation
          path: |
            build338-build.log
            build338-review/
          retention-days: 14
