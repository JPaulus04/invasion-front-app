name: World 1 artwork installer tests

on:
  push:
    branches: [build-327]
    paths:
      - 'scripts/install_world1_art.py'
      - 'tests/test_install_world1_art.py'
      - '.github/workflows/world1-art-installer-tests.yml'
  pull_request:
    paths:
      - 'scripts/install_world1_art.py'
      - 'tests/test_install_world1_art.py'
      - '.github/workflows/world1-art-installer-tests.yml'
  workflow_dispatch:

jobs:
  test-installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate artwork installation scenarios
        run: python3 -m unittest discover -s tests -p 'test_install_world1_art.py' -v
