name: Queue TestFlight 339
on:
  push:
    branches: [release/dispatch-339-fddb3b6]
    paths: [.github/workflows/dispatch-build339.yml]
permissions:
  actions: write
  contents: read
jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Wait for merged candidate and start signed release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh run watch 44830727208 --interval 60 --exit-status
          test "$(gh api repos/$GH_REPO/branches/main --jq .commit.sha)" = "fddb3b6707a5898c185b6f560db32278d6dc6aad"
          gh workflow run testflight.yml --ref main -f build_number=339 -f use_build338_reviewed_evidence=false
